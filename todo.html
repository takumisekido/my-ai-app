<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のTo Do</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 390px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header .date {
      color: rgba(255,255,255,0.75);
      font-size: 14px;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }

    header h1 {
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .progress-bar-wrapper {
      background: rgba(255,255,255,0.2);
      border-radius: 99px;
      height: 6px;
      margin: 14px 0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #fff;
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    .progress-label {
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      text-align: center;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 24px;
    }

    .task-card {
      background: #fff;
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      transition: transform 0.15s ease, opacity 0.3s ease;
      cursor: pointer;
    }

    .task-card:active {
      transform: scale(0.97);
    }

    .task-card.done {
      opacity: 0.55;
    }

    .task-card.done .task-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .task-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .task-card.done .task-number {
      background: #ccc;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 16px;
      font-weight: 600;
      color: #222;
      word-break: break-word;
      outline: none;
      border: none;
      background: transparent;
      width: 100%;
      font-family: inherit;
      cursor: text;
      line-height: 1.4;
    }

    .task-text::placeholder {
      color: #bbb;
      font-weight: 400;
    }

    .check-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2.5px solid #ddd;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .check-btn.checked {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: transparent;
    }

    .check-btn .checkmark {
      display: none;
      color: #fff;
      font-size: 14px;
    }

    .check-btn.checked .checkmark {
      display: block;
    }

    .hint {
      text-align: center;
      color: rgba(255,255,255,0.65);
      font-size: 12px;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <p class="date" id="today-date"></p>
      <h1>今日のTo Do</h1>
      <div class="progress-bar-wrapper">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="progress-label" id="progress-label">0 / 3 完了</p>
    </header>

    <div class="task-list" id="task-list"></div>

    <p class="hint">タスク名をタップして入力 ・ ○をタップで完了</p>
  </div>

  <script>
    const STORAGE_KEY = 'todo_tasks_v1';

    const defaultTasks = [
      { text: '', done: false },
      { text: '', done: false },
      { text: '', done: false },
    ];

    function loadTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return defaultTasks.map(t => ({ ...t }));
    }

    function saveTasks(tasks) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function updateProgress(tasks) {
      const done = tasks.filter(t => t.done).length;
      const pct = (done / tasks.length) * 100;
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-label').textContent = `${done} / ${tasks.length} 完了`;
    }

    function setDate() {
      const d = new Date();
      const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('today-date').textContent = d.toLocaleDateString('ja-JP', opts);
    }

    function render(tasks) {
      const list = document.getElementById('task-list');
      list.innerHTML = '';

      tasks.forEach((task, i) => {
        const card = document.createElement('div');
        card.className = 'task-card' + (task.done ? ' done' : '');

        const num = document.createElement('div');
        num.className = 'task-number';
        num.textContent = i + 1;

        const content = document.createElement('div');
        content.className = 'task-content';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'task-text';
        input.placeholder = `タスク ${i + 1} を入力`;
        input.value = task.text;
        input.maxLength = 40;

        input.addEventListener('input', () => {
          tasks[i].text = input.value;
          saveTasks(tasks);
        });

        input.addEventListener('click', (e) => {
          e.stopPropagation();
        });

        content.appendChild(input);

        const btn = document.createElement('button');
        btn.className = 'check-btn' + (task.done ? ' checked' : '');
        btn.innerHTML = '<span class="checkmark">✓</span>';
        btn.setAttribute('aria-label', '完了にする');

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          tasks[i].done = !tasks[i].done;
          saveTasks(tasks);
          card.className = 'task-card' + (tasks[i].done ? ' done' : '');
          btn.className = 'check-btn' + (tasks[i].done ? ' checked' : '');
          input.className = 'task-text';
          updateProgress(tasks);
          num.parentElement.querySelector('.task-number').style.background =
            tasks[i].done ? '#ccc' : 'linear-gradient(135deg, #667eea, #764ba2)';
        });

        card.appendChild(num);
        card.appendChild(content);
        card.appendChild(btn);
        list.appendChild(card);
      });

      updateProgress(tasks);
    }

    const tasks = loadTasks();
    setDate();
    render(tasks);
  </script>

</body>
</html>
